apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: samba
  template:
    metadata:
      labels:
        app: samba
    spec:
      containers:
        - name: samba
          image: "{{ .Values.samba.image.repository }}:{{ .Values.samba.image.tag }}"
          args:
            - "-s"
            - "{{ .Values.samba.shareName }};/downloads"
          ports:
            - containerPort: 139
            - containerPort: 445
          volumeMounts:
            - name: data
              mountPath: /downloads
              subPath: downloads
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dl-data
---
apiVersion: v1
kind: Service
metadata:
  name: samba
  labels:
    expose: lan
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/l2-announcer
  selector:
    app: samba
  ports:
    - name: netbios-ssn
      port: 139
      targetPort: 139
      protocol: TCP
    - name: microsoft-ds
      port: 445
      targetPort: 445
      protocol: TCP
