apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      containers:
        - name: plex
          image: "{{ .Values.plex.image.repository }}:{{ .Values.plex.image.tag }}"
          env:
            - name: PUID
              value: "{{ .Values.puid }}"
            - name: PGID
              value: "{{ .Values.pgid }}"
            - name: TZ
              value: {{ .Values.timezone }}
            - name: VERSION
              value: docker
          ports:
            - containerPort: {{ .Values.plex.port }}
            - containerPort: 32469
            - containerPort: 1900
              protocol: UDP
            - containerPort: 32410
              protocol: UDP
            - containerPort: 32412
              protocol: UDP
            - containerPort: 32413
              protocol: UDP
            - containerPort: 32414
              protocol: UDP
          volumeMounts:
            - name: data
              mountPath: /config
              subPath: plex-config
            - name: data
              mountPath: /movies
              subPath: downloads
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dl-data
---
apiVersion: v1
kind: Service
metadata:
  name: plex
  labels:
    expose: lan
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/l2-announcer
  selector:
    app: plex
  ports:
    - name: main
      port: {{ .Values.plex.port }}
      targetPort: {{ .Values.plex.port }}
      protocol: TCP
    - name: dlna
      port: 32469
      targetPort: 32469
      protocol: TCP
    - name: gdm-1900
      port: 1900
      targetPort: 1900
      protocol: UDP
    - name: gdm-32410
      port: 32410
      targetPort: 32410
      protocol: UDP
    - name: gdm-32412
      port: 32412
      targetPort: 32412
      protocol: UDP
    - name: gdm-32413
      port: 32413
      targetPort: 32413
      protocol: UDP
    - name: gdm-32414
      port: 32414
      targetPort: 32414
      protocol: UDP
